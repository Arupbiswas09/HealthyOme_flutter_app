name: healthy_o_me
description: Healthy-o-me - A healthy lifestyle tracking app built with Flutter, MVVM and Clean Architecture
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # State Management (MVVM)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  
  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.2

  # Serialization
  json_annotation: ^4.9.0
  
  # Functional Programming
  dartz: ^0.10.1

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Utilities
  equatable: ^2.0.5
  intl: any
  uuid: ^4.3.3
  logger: ^2.1.0
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0

  # Health / Fitness (optional)
  permission_handler: ^11.3.0
  
  # Animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0

  # Lints & testing
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

