name: healthy_o_me
description: Healthy-o-me - A healthy lifestyle tracking app built with Flutter, MVVM and Clean Architecture
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management (MVVM)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0

  # Serialization
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.1.0

  # Health / Fitness (optional)
  permission_handler: ^11.3.0
  pedometer: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Lints & testing
  flutter_lints: ^3.0.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
